[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag"
version = "0.1.0"
description = "PDF ingest-to-retrieve RAG pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
